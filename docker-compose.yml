services:
  db:
    image: postgres:15-alpine
    container_name: ngo_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ngo_accounting}
      POSTGRES_USER: ${POSTGRES_USER:-admin_ngo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongSecureNgoPassword2026}
    # لا تُنشر قاعدة البيانات خارج شبكة الدوكر (التطبيق يتصل بها داخلياً).
    # لو أردت وصولاً خارجياً للإدارة: غيّر إلى "127.0.0.1:5433:5432"
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_ngo} -d ${POSTGRES_DB:-ngo_accounting}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web_app:
    image: ngo-accounting-system:latest
    container_name: ngo_web_erp
    restart: always
    build: .
    ports:
      - "${WEB_PORT:-8081}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin_ngo}:${POSTGRES_PASSWORD:-StrongSecureNgoPassword2026}@db:5432/${POSTGRES_DB:-ngo_accounting}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: